services:
  frontend:
    build:
      context: ./frontend
    image: servercompass-demo-frontend:latest
    container_name: sc-demo-frontend
    environment:
      API_BASE_URL: http://api:4000
      PORT: 3000
    ports:
      - "8080:3000"
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ./api
    image: servercompass-demo-api:latest
    container_name: sc-demo-api
    env_file:
      - .env
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: sc-demo-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: sc-demo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
